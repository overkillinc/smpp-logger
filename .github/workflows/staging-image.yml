name: Build staging image

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/overkillinc/smpp-logger:staging
            ghcr.io/overkillinc/smpp-logger:main-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # keep build cache disabled for simplicity in CI

      - name: Annotate release status
        run: echo "Built and pushed staging image to ghcr.io/overkillinc/smpp-logger:staging" 
