apiVersion: v1
kind: Namespace
metadata:
  name: smpp-logger
---
apiVersion: v1
kind: Secret
metadata:
  name: smpp-logger-auth
  namespace: smpp-logger
# Create this secret locally with your own credentials instead of committing them here.
# Example (run locally):
# kubectl -n smpp-logger create secret generic smpp-logger-auth --from-literal=system-id=<SYSTEM_ID> --from-literal=password=<PASSWORD>
# Do not commit real credentials to the repository.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smpp-logger
  namespace: smpp-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smpp-logger
  template:
    metadata:
      labels:
        app: smpp-logger
    spec:
      containers:
        - name: smpp-logger
          image: ghcr.io/overkillinc/smpp-logger:latest
          ports:
            - containerPort: 2775
              name: smpp
            - containerPort: 8080
              name: http
          env:
            - name: SMPP_LOGGER_SYSTEM_ID
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-auth
                  key: system-id
            - name: SMPP_LOGGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-auth
                  key: password
            - name: SMPP_LOGGER_LISTEN_ADDR
              value: :2775
            - name: SMPP_LOGGER_LOG_FORMAT
              value: text
            - name: SMPP_LOGGER_UI_ADDR
              value: :8080
            - name: SMPP_LOGGER_UI_USER
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-ui-credentials
                  key: SMPP_LOGGER_UI_USER
            - name: SMPP_LOGGER_UI_PASS
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-ui-credentials
                  key: SMPP_LOGGER_UI_PASS
          readinessProbe:
            tcpSocket:
              port: smpp
          livenessProbe:
            tcpSocket:
              port: smpp
      imagePullSecrets:
        - name: ghcr-creds
---
apiVersion: v1
kind: Service
metadata:
  name: smpp-logger
  namespace: smpp-logger
spec:
  type: NodePort
  selector:
    app: smpp-logger
  ports:
    - name: smpp
      port: 2775
      targetPort: smpp
      nodePort: 30075
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31513
