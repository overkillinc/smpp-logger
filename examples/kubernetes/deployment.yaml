apiVersion: v1
kind: Namespace
metadata:
  name: smpp-logger
---
apiVersion: v1
kind: Secret
metadata:
  name: smpp-logger-auth
  namespace: smpp-logger
type: Opaque
stringData:
  # Dummy credentials for quick local testing only
  # system-id: smpp-logger
  # password: smpp-logger
  system-id: smpp-logger
  password: smpp-logger
# WARNING: The secret above contains dummy credentials intended for quick testing only.
# DO NOT use these credentials in production. Replace with secure credentials or create the secret locally
# before deploying in any environment that you do not control.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smpp-logger
  namespace: smpp-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smpp-logger
  template:
    metadata:
      labels:
        app: smpp-logger
    spec:
      containers:
        - name: smpp-logger
          image: ghcr.io/overkillinc/smpp-logger:v1.0.10
          ports:
            - containerPort: 2775
              name: smpp
            - containerPort: 8080
              name: http
          env:
            - name: SMPP_LOGGER_SYSTEM_ID
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-auth
                  key: system-id
            - name: SMPP_LOGGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-auth
                  key: password
            - name: SMPP_LOGGER_LISTEN_ADDR
              value: :2775
            - name: SMPP_LOGGER_LOG_FORMAT
              value: text
            - name: SMPP_LOGGER_UI_ADDR
              value: :8080
            - name: SMPP_LOGGER_UI_USER
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-ui-credentials
                  key: SMPP_LOGGER_UI_USER
            - name: SMPP_LOGGER_UI_PASS
              valueFrom:
                secretKeyRef:
                  name: smpp-logger-ui-credentials
                  key: SMPP_LOGGER_UI_PASS
          readinessProbe:
            tcpSocket:
              port: smpp
          livenessProbe:
            tcpSocket:
              port: smpp
      imagePullSecrets:
        - name: ghcr-creds
---
apiVersion: v1
kind: Service
metadata:
  name: smpp-logger
  namespace: smpp-logger
spec:
  type: NodePort
  selector:
    app: smpp-logger
  ports:
    - name: smpp
      port: 2775
      targetPort: smpp
      nodePort: 30075
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31513
