apiVersion: v1
kind: Service
metadata:
  name: smpp-logger-ui
  namespace: smpp-logger
spec:
  selector:
    app: smpp-logger
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Production ingress (uses TLS via cert-manager, serves production host)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smpp-logger-ingress
  namespace: smpp-logger
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - smpp-logger.de.it-union.net
      secretName: smpp-logger-tls
  rules:
    - host: smpp-logger.de.it-union.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smpp-logger-ui
                port:
                  number: 8080
---
# Staging ingress for testing on a secondary subdomain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smpp-logger-staging-ingress
  namespace: smpp-logger-staging
spec:
  ingressClassName: traefik
  rules:
    - host: smpp-logger-staging.de.it-union.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smpp-logger
                port:
                  number: 8080
